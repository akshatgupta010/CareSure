services:
  backend:
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGIN: http://localhost:4173
    ports:
      - "8000:8000"

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "4173:4173"
